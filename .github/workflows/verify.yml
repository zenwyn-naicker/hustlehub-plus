name: Verification
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            client/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix client ci
      - name: Prepare local HTTPS and temporary container secrets
        run: |
          mkdir -p backend/certs artifacts
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes -keyout backend/certs/localhost-key.pem -out backend/certs/localhost-cert.pem -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          node -e "const fs=require('fs'),c=require('crypto');fs.writeFileSync('.env.compose',['MONGO_ROOT_PASSWORD','MONGO_APP_PASSWORD','JWT_SECRET'].map(k=>k+'='+c.randomBytes(48).toString('hex')).join('\n')+'\n')"
      - name: Static security analysis (zero warnings)
        run: npm run lint -- --format json --output-file artifacts/eslint.json
      - name: Runtime dependency security checks
        run: |
          npm --prefix backend audit --omit=dev --audit-level=low
          npm --prefix client audit --omit=dev --audit-level=low
      - name: Development dependency security checks
        run: |
          npm audit --audit-level=low --json > artifacts/quality-development-audit.json
          npm --prefix client audit --audit-level=low --json > artifacts/client-development-audit.json
          npm --prefix backend audit --audit-level=critical --json > artifacts/backend-development-audit.json
      - name: Backend unit tests
        run: npm --prefix backend run test:unit
      - name: Backend API and security tests
        run: npm --prefix backend test
      - name: Frontend tests
        run: npm --prefix client test
      - name: Build backend and frontend
        run: |
          npm --prefix backend run build
          npm --prefix client run build
      - name: Build and start both application containers
        run: |
          docker compose --env-file .env.compose config --quiet
          docker compose --env-file .env.compose up --build -d --wait --wait-timeout 180
      - name: Verify container workflow and restart persistence
        run: npm run test:stack
      - name: Record container status and API logs
        if: always()
        run: |
          docker compose --env-file .env.compose ps -a > artifacts/container-status.txt
          docker compose --env-file .env.compose logs --no-color api > artifacts/api-logs.txt
      - name: Upload safe verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          retention-days: 14
          path: |
            artifacts/
            backend/evidence/verification.json
            backend/evidence/security-verification.json
            backend/evidence/security-safe-logs.json
      - name: Stop the temporary stack
        if: always()
        run: docker compose --env-file .env.compose down
